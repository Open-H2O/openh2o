services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openh2o}
      POSTGRES_USER: ${POSTGRES_USER:-openh2o}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openh2o}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 is load-bearing. Without it pg_isready probes the unix
      # socket, which the postgres image's TEMPORARY initdb server answers —
      # so on a fresh volume the container reports healthy, `--wait` and
      # `depends_on: service_healthy` release, and the next statement hits
      # "FATAL: the database system is shutting down" as the temp server hands
      # over to the real one. That server is started with `listen_addresses=''`
      # and cannot accept TCP at all, so a TCP probe answers only when the real
      # server is up. Refused the v2.9 production deploy on 2026-08-01; see the
      # note on demo_wait_for_db in scripts/_demo-lib.sh.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-openh2o}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.production}
      DATABASE_URL: postgis://${POSTGRES_USER:-openh2o}:${POSTGRES_PASSWORD:-openh2o}@db:5432/${POSTGRES_DB:-openh2o}
    depends_on:
      db:
        condition: service_healthy
    # Bound the Docker log file. The json-file driver is UNCAPPED by default —
    # verified, not assumed: `docker inspect` on both containers returns
    # `json-file map[]`, an empty options map, and this host has no
    # /etc/docker/daemon.json setting a default. Until now that was harmless
    # because these logs were nearly silent (642 lines in 12 hours). Turning on
    # the gunicorn access log (entrypoint.sh) is precisely the change that makes
    # an uncapped log file matter, so the cap ships in the same commit rather
    # than waiting for a full disk to ask for it. 10 MB x 5 files = ~50 MB.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - static_files:/app/staticfiles
      # User-uploaded media (feedback screenshots) — persists across rebuilds so
      # a report's attachments are not lost on the next deploy. Lives only on the
      # server; never served on the public web (n8n receives the bytes directly).
      - media_files:/app/media
      # Production logs (rotating file handler). A named volume so tracebacks
      # survive a container recreate/redeploy — see config/settings/production.py.
      - logs_data:/app/logs
      # Earth Engine service-account key dir (OPENET_MODE=gee only). Read-only.
      # Mount the directory, not the file: a single-file bind to a path that
      # does not exist yet would make Docker create a stray directory and break
      # the default api-mode deploy. The key (./secrets/gee-key.json) is
      # gitignored and must never be committed; api mode never reads it.
      # See docs/earth-engine-tier-setup.md.
      - ./secrets:/run/secrets:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static_files:/srv/static:ro
      # Branded outage page (Caddyfile handle_errors). A DIRECTORY mount on
      # purpose: a single-file mount detaches whenever the host file is replaced
      # by a rename (git checkout, sed -i), leaving the container serving a stale
      # copy; files inside a mounted directory resolve by name and stay correct.
      - ./error-pages:/srv/error:ro
      - caddy_data:/data
      - caddy_config:/config
      # The request record the Caddyfile's `log access_file` block writes. A
      # named volume, not a bind mount, and that is the whole point: it survives
      # `docker compose up -d --build`, which recreates the container and throws
      # away everything `docker compose logs caddy` was holding. This is the copy
      # that is still there after a deploy.
      - caddy_logs:/var/log/caddy
    # Same uncapped-driver finding as `web` above; see that comment.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      # Wait for the web container's HEALTHCHECK to pass before starting Caddy,
      # so a cold boot never forwards to a web process that is not yet listening
      # (the ~6 s collectstatic/migrate window that otherwise returns 502s).
      web:
        condition: service_healthy

volumes:
  db_data:
  static_files:
  media_files:
  logs_data:
  caddy_data:
  caddy_config:
  caddy_logs:
