{% comment %}
Returned after a successful PATCH or cancel. Mirrors wells/partials/
_field_value.html, scoped to one WellIrrigatedParcel row. Replaces the
content of #well-irrigated-share-<wip.pk>.
{% endcomment %}
<span class="text-secondary text-sm">share {{ wip.fraction|floatformat:4 }}</span>
{% if user_can_write %}<button
  hx-get="{% url 'wells:irrigated_parcel_edit_share' well.pk wip.pk %}"
  hx-target="#well-irrigated-share-{{ wip.pk }}"
  hx-swap="innerHTML"
  style="background: none; border: none; cursor: pointer; color: var(--color-text-tertiary); padding: 2px 4px; border-radius: var(--radius-sm);"
  title="Edit share">
  &#9998;
</button>{% endif %}
