{% extends "base_auth.html" %}
{% block title %}Sign Out - Open Water Accounting Platform{% endblock %}
{% block content %}
<div class="card-raised w-full text-center" style="max-width: 420px;">
    <h1 class="auth-title">Sign out</h1>
    <p class="text-sm mb-md text-secondary">Are you sure you want to sign out?</p>
    <form method="post" action="{% url 'account_logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn-primary w-full mb-md">Sign out</button>
    </form>
    <a href="/" class="text-sm link-accent">Cancel</a>
</div>
{% endblock %}
