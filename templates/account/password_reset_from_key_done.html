{% extends "base_auth.html" %}
{% block title %}Password Changed - Open Water Accounting Platform{% endblock %}
{% block content %}
<div class="card-raised w-full text-center" style="max-width: 420px;">
    <h1 class="auth-title">Password changed</h1>
    <p class="text-sm mb-md text-secondary">Your password has been reset. You can now log in with your new password.</p>
    <a href="{% url 'account_login' %}" class="btn-primary">Log in</a>
</div>
{% endblock %}
