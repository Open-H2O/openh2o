name: tests

# Runs the lint check and the full pytest suite on every push and pull request.
# The two jobs in clean-install.yml prove what a fresh install and the demo
# contain; this workflow proves the code still does what its tests say.
#
# The suite runs inside the web image, against PostGIS, exactly as `make test`
# runs it locally, so CI and a contributor's machine cannot disagree about the
# environment.
#
# Tests marked `release` are left out here and from `make test`: each takes many
# minutes (the Merced demonstration loaded and its open year calculated twice),
# which held every push for twenty minutes or more. deploy-checks.yml runs them
# on the candidate before a release and on its weekly run; `make test-release`
# runs them on a contributor's machine.
#
# Tests marked `network` are left out here. They reach real public services
# (state and federal GIS endpoints), and a gate that goes red because one of
# those had a bad afternoon is a gate people learn to ignore. `make test` still
# runs them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes this run's answer out of date, so it is
# cancelled: two pushes a minute apart cost one run, not two overlapping ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned so a ruff release that adds or changes a rule cannot turn the
      # build red without a commit here. The rule set lives in pyproject.toml.
      - name: Install ruff
        run: pip install ruff==0.16.10
      - name: Lint
        run: ruff check .
      # CLAUDE.md "Never hardcode a colour": the pre-Deep-Water values may only
      # fall. Standard library only, so it needs nothing installed.
      - name: Colour literals
        run: python scripts/check_colour_literals.py
      # scripts/test_reasons.py reads git, and the web image has no git, so its tests skip in the
      # suite below; here, on the runner, they run. Its own tests make their own repositories.
      - name: Git-only script tests
        run: |
          pip install pytest==9.1.1
          python -m pytest tests/test_test_reasons.py -q -p no:cacheprovider -p no:django --noconftest
      # The commit-message rule (CONTRIBUTING.md, Ground rules). A pushed commit is never rewritten,
      # so a red step here only means a clone committed without `make hooks`. Commits from before the
      # rule began (RULE_START, the commit that added its test, and its ancestors) are not read.
      - name: Commit messages
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          RULE_START: 21ccaf792fdc7b81b1f833b2636c30a839b9c198
        run: |
          git fetch -q --unshallow origin 2>/dev/null || git fetch -q origin
          python scripts/check_commit_message.py --range "$BEFORE..$AFTER" --after "$RULE_START"

  # The suite runs as five jobs at once, and each job runs its tests in parallel
  # (pytest-xdist, one worker per CPU of the runner). As one serial job it took 37
  # to 60 minutes on GitHub's runners and was cancelled at the 60-minute limit with
  # no test failed; as one parallel job about 15 minutes, so several jobs still pay.
  # The module-drop proof boots a separate Django process for each of its cases and
  # is about a third of the run on its own, so it gets two halves of its own
  # (drop-1, drop-2). The other test files are dealt into three parts by measured
  # seconds, longest first, so the parts finish together; the seconds live in
  # tests/ci_durations.tsv. To refresh them, download a run's durations-* artifacts
  # and run `python3 scripts/ci_parts.py --refresh durations-*/junit.xml`.
  # The workflow passes only when all five jobs do, which is what `make deploy`
  # reads (scripts/ci_gate.py).
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # backstop: a hung run fails here instead of at the 6h runner limit
    strategy:
      fail-fast: false
      matrix:
        part: ["1", "2", "3", drop-1, drop-2]
    env:
      # Throwaway values for CI only, not secrets. Same as clean-install.yml.
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: ci-tests-not-a-secret
      POSTGRES_DB: openh2o
      POSTGRES_USER: openh2o
      POSTGRES_PASSWORD: openh2o
    steps:
      - uses: actions/checkout@v4

      # docker-compose.yml's web service declares `env_file: .env`, which is
      # gitignored and absent on a clean checkout. Same throwaway file as
      # clean-install.yml.
      - name: Write throwaway CI .env
        run: |
          cat > .env <<'EOF'
          SECRET_KEY=ci-tests-not-a-secret
          DJANGO_SETTINGS_MODULE=config.settings.local
          POSTGRES_DB=openh2o
          POSTGRES_USER=openh2o
          POSTGRES_PASSWORD=openh2o
          OPENH2O_MODULES=all
          EOF

      - name: Build web image
        run: docker compose build web

      # Starting web runs its normal boot (collectstatic, migrate) and waits for
      # its health check, so a broken boot fails here with the boot's own error
      # rather than as a wall of test failures.
      - name: Start database and web
        run: docker compose up -d --wait db web

      # scripts/ci_parts.py fails this step when the three parts and the
      # module-drop file do not hold every test module exactly once, or the two
      # module-drop halves do not hold every module-drop test exactly once. The
      # halves split the node ids pytest collects inside the container.
      - name: Choose this job's test files
        env:
          PART: ${{ matrix.part }}
        run: |
          case "$PART" in
            drop-*)
              docker compose exec -T -e OPENH2O_MODULES=all web \
                python -m pytest --collect-only -q -p no:cacheprovider \
                --ds=config.settings.local tests/test_droppability_acceptance.py \
                | python3 scripts/ci_parts.py --drop-half "${PART#drop-}" > files.txt
              echo "load" > dist.txt ;;
            *)
              python3 scripts/ci_parts.py --part "$PART" --parts 3 > files.txt
              echo "loadfile" > dist.txt ;;
          esac
          wc -l < files.txt

      # The node ids are read into an array rather than split by the shell: a
      # module-drop id carries [brackets] the shell would treat as a pattern.
      # loadfile keeps each test file on one worker; the module-drop cases are
      # independent, so they are dealt one by one (load).
      - name: Run the test suite
        run: |
          mapfile -t files < files.txt
          docker compose exec -T -e OPENH2O_MODULES=all web \
            python -m pytest "${files[@]}" \
            --ds=config.settings.local \
            -m "not network and not release" \
            -p no:cacheprovider \
            -n auto --dist "$(cat dist.txt)" \
            --junitxml=/tmp/junit.xml \
            -q

      # Per-test seconds, for `scripts/ci_parts.py --refresh`.
      - name: Copy out the test durations
        if: always()
        run: |
          mkdir -p durations
          docker compose cp web:/tmp/junit.xml durations/junit.xml \
            || echo "no JUnit file: the suite did not start"

      - name: Upload the test durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durations-${{ matrix.part }}
          path: durations/
          retention-days: 14
          if-no-files-found: ignore

      - name: Web log on failure
        if: failure()
        run: docker compose logs web --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v

  # Starts the deploy checks (deploy-checks.yml) for this commit against the live one as soon as this
  # push's tests are green, so a later release of the same commit (deploy.sh, through
  # scripts/regress-gate.sh, which takes an existing run with the same title) waits on nothing
  # instead of about 27 minutes (run 44386327795: 26.6). Only for
  # pushes to main, never a pull request. A site or GitHub outage here is a warning, never red:
  # this workflow's colour means the code's tests.
  release-check-ahead:
    needs: [lint, pytest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start the deploy checks for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The pair is resolved as deploy.sh resolves it (its lines after "The deploy checks, before anything
          # on the server changes."): the candidate, the commit named by the live page footer, and their merge
          # base. If the two ever drift, the titles differ and a release simply dispatches its own run, which
          # costs today's wait and nothing else.
          set -uo pipefail
          warn() { echo "::warning::release-check-ahead: $*"; echo "release-check-ahead: $*" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          cand=$GITHUB_SHA
          desc=$(curl -fsS --max-time 30 "${OPENH2O_SITE_URL:-https://openh2o.com/}" | sed -n 's/.*app-footer-version"[^>]*>\([^<]*\)<.*/\1/p' | head -1) || desc=""
          desc=${desc%-dirty}
          case $desc in *-g*) short=${desc##*-g} ;; *) short=$desc ;; esac
          live=""
          [ -n "$short" ] && live=$(git rev-parse --verify --quiet "$short^{commit}") || true
          [ -n "$live" ] || warn "no live commit read from the page footer ('$desc'); nothing started"
          if [ "$live" = "$cand" ] || git merge-base --is-ancestor "$cand" "$live"; then
            echo "release-check-ahead: $cand is live or older than live ${live:0:12}; nothing to check" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          base=$(git merge-base "$live" "$cand") || warn "no merge base for live ${live:0:12} and $cand"
          title="deploy checks $cand from $base"
          runs=$(gh run list --workflow deploy-checks.yml -L 100 --json databaseId,displayTitle \
            --jq ".[] | select(.displayTitle == \"$title\") | .databaseId") || warn "could not list deploy-checks runs"
          if [ -n "$runs" ]; then
            echo "release-check-ahead: run ${runs%%$'\n'*} already has '$title'; nothing started" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run deploy-checks.yml --ref main -f "base=$base" -f "head=$cand" -f ahead=true \
            || warn "could not start the deploy checks for '$title'"
          echo "release-check-ahead: started '$title' (live ${live:0:12})" | tee -a "$GITHUB_STEP_SUMMARY"
