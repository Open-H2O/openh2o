name: tests

# Runs the lint check and the full pytest suite on every push and pull request.
# The two jobs in clean-install.yml prove what a fresh install and the demo
# contain; this workflow proves the code still does what its tests say.
#
# The suite runs inside the web image, against PostGIS, exactly as `make test`
# runs it locally, so CI and a contributor's machine cannot disagree about the
# environment.
#
# Tests marked `network` are left out here. They reach real public services
# (state and federal GIS endpoints), and a gate that goes red because one of
# those had a bad afternoon is a gate people learn to ignore. `make test` still
# runs them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned so a ruff release that adds or changes a rule cannot turn the
      # build red without a commit here. The rule set lives in pyproject.toml.
      - name: Install ruff
        run: pip install ruff==0.16.10
      - name: Lint
        run: ruff check .
      # CLAUDE.md "Never hardcode a colour": the pre-Deep-Water values may only
      # fall. Standard library only, so it needs nothing installed.
      - name: Colour literals
        run: python scripts/check_colour_literals.py

  # The suite runs as six jobs at once, and each job runs its tests in parallel
  # (pytest-xdist, one worker per CPU of the runner). As one serial job it took 37
  # to 60 minutes on GitHub's runners and was cancelled at the 60-minute limit with
  # no test failed; as one parallel job about 15 minutes, so several jobs still pay.
  # Every test file is one unit, except the module-drop proof: it boots a separate
  # Django process for each of its cases and is about 30% of the run on its own,
  # so each of its cases is a unit. The units are dealt into six parts by measured
  # seconds, longest first, so the parts finish together; the seconds live in
  # tests/ci_durations.tsv. To refresh them, download the durations-* artifacts of
  # a few runs, one folder per run, and run
  # `python3 scripts/ci_parts.py --refresh run-*/durations-*/junit.xml`.
  # The workflow passes only when all six jobs do, which is what `make deploy`
  # reads (scripts/ci_gate.py).
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # backstop: a hung run fails here instead of at the 6h runner limit
    strategy:
      fail-fast: false
      matrix:
        part: ["1", "2", "3", "4", "5", "6"]
    env:
      # Throwaway values for CI only, not secrets. Same as clean-install.yml.
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: ci-tests-not-a-secret
      POSTGRES_DB: openh2o
      POSTGRES_USER: openh2o
      POSTGRES_PASSWORD: openh2o
    steps:
      - uses: actions/checkout@v4

      # docker-compose.yml's web service declares `env_file: .env`, which is
      # gitignored and absent on a clean checkout. Same throwaway file as
      # clean-install.yml.
      - name: Write throwaway CI .env
        run: |
          cat > .env <<'EOF'
          SECRET_KEY=ci-tests-not-a-secret
          DJANGO_SETTINGS_MODULE=config.settings.local
          POSTGRES_DB=openh2o
          POSTGRES_USER=openh2o
          POSTGRES_PASSWORD=openh2o
          OPENH2O_MODULES=all
          EOF

      - name: Build web image
        run: docker compose build web

      # Starting web runs its normal boot (collectstatic, migrate) and waits for
      # its health check, so a broken boot fails here with the boot's own error
      # rather than as a wall of test failures.
      - name: Start database and web
        run: docker compose up -d --wait db web

      # scripts/ci_parts.py fails this step when the six parts do not hold every
      # test file and every module-drop case exactly once, or when no module-drop
      # case was collected. The module-drop ids come from pytest inside the
      # container, because the cases are built from code the runner host cannot
      # import.
      - name: Choose this job's tests
        env:
          PART: ${{ matrix.part }}
        run: |
          docker compose exec -T -e OPENH2O_MODULES=all web \
            python -m pytest --collect-only -q -p no:cacheprovider \
            --ds=config.settings.local tests/test_droppability_acceptance.py \
            > drop_ids.txt
          python3 scripts/ci_parts.py --part "$PART" --parts 6 \
            --drop-ids drop_ids.txt > files.txt
          wc -l < files.txt

      # The tests are read into an array rather than split by the shell: a
      # module-drop id carries [brackets] the shell would treat as a pattern.
      # loadfile keeps each test file on one worker; conftest.py deals the
      # module-drop cases one at a time even so.
      - name: Run the test suite
        run: |
          mapfile -t files < files.txt
          docker compose exec -T -e OPENH2O_MODULES=all web \
            python -m pytest "${files[@]}" \
            --ds=config.settings.local \
            -m "not network" \
            -p no:cacheprovider \
            -n auto --dist loadfile \
            --junitxml=/tmp/junit.xml \
            -q

      # Per-test seconds, for `scripts/ci_parts.py --refresh`.
      - name: Copy out the test durations
        if: always()
        run: |
          mkdir -p durations
          docker compose cp web:/tmp/junit.xml durations/junit.xml \
            || echo "no JUnit file: the suite did not start"

      - name: Upload the test durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durations-${{ matrix.part }}
          path: durations/
          retention-days: 14
          if-no-files-found: ignore

      - name: Web log on failure
        if: failure()
        run: docker compose logs web --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
