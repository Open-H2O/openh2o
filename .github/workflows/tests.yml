name: tests

# Runs the lint check and the full pytest suite on every push and pull request.
# The two jobs in clean-install.yml prove what a fresh install and the demo
# contain; this workflow proves the code still does what its tests say.
#
# The suite runs inside the web image, against PostGIS, exactly as `make test`
# runs it locally, so CI and a contributor's machine cannot disagree about the
# environment.
#
# Tests marked `network` are left out here. They reach real public services
# (state and federal GIS endpoints), and a gate that goes red because one of
# those had a bad afternoon is a gate people learn to ignore. `make test` still
# runs them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned so a ruff release that adds or changes a rule cannot turn the
      # build red without a commit here. The rule set lives in pyproject.toml.
      - name: Install ruff
        run: pip install ruff==0.16.10
      - name: Lint
        run: ruff check .

  # The suite runs as four jobs at once. As one job it took 37 to 60 minutes on
  # GitHub's runners and was cancelled at the 60-minute limit with no test failed.
  # The module-drop proof boots a separate Django process for each of its 30
  # cases and is about a third of the run on its own, so it is one job; the other
  # test files are dealt round-robin into three. The workflow passes only when all
  # four do, which is what `make deploy` reads (scripts/ci_gate.py).
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # backstop: a hung run fails here instead of at the 6h runner limit
    strategy:
      fail-fast: false
      matrix:
        part: [module-drop, "1", "2", "3"]
    env:
      # Throwaway values for CI only, not secrets. Same as clean-install.yml.
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: ci-tests-not-a-secret
      POSTGRES_DB: openh2o
      POSTGRES_USER: openh2o
      POSTGRES_PASSWORD: openh2o
    steps:
      - uses: actions/checkout@v4

      # docker-compose.yml's web service declares `env_file: .env`, which is
      # gitignored and absent on a clean checkout. Same throwaway file as
      # clean-install.yml.
      - name: Write throwaway CI .env
        run: |
          cat > .env <<'EOF'
          SECRET_KEY=ci-tests-not-a-secret
          DJANGO_SETTINGS_MODULE=config.settings.local
          POSTGRES_DB=openh2o
          POSTGRES_USER=openh2o
          POSTGRES_PASSWORD=openh2o
          OPENH2O_MODULES=all
          EOF

      - name: Build web image
        run: docker compose build web

      # Starting web runs its normal boot (collectstatic, migrate) and waits for
      # its health check, so a broken boot fails here with the boot's own error
      # rather than as a wall of test failures.
      - name: Start database and web
        run: docker compose up -d --wait db web

      # Every test module sits directly in tests/ (pyproject.toml's python_files).
      # The step fails if the three parts and the module-drop job do not together
      # hold every module exactly once.
      - name: Choose this job's test files
        env:
          PART: ${{ matrix.part }}
        run: |
          python3 - <<'EOF' > files.txt
          import glob, os, sys
          drop = "tests/test_droppability_acceptance.py"
          names = sorted({*glob.glob("tests/test_*.py"), *glob.glob("tests/*_tests.py"), *glob.glob("tests/tests.py")})
          rest = [n for n in names if n != drop]
          parts = {str(k): rest[k - 1::3] for k in (1, 2, 3)}
          dealt = sorted(n for files in parts.values() for n in files) + [drop]
          if sorted(dealt) != names:
              sys.exit("the parts do not hold every test module exactly once")
          part = os.environ["PART"]
          print("\n".join([drop] if part == "module-drop" else parts[part]))
          EOF
          wc -l < files.txt

      - name: Run the test suite
        run: >-
          docker compose exec -T -e OPENH2O_MODULES=all web
          python -m pytest $(cat files.txt)
          --ds=config.settings.local
          -m "not network"
          -p no:cacheprovider
          -q

      - name: Web log on failure
        if: failure()
        run: docker compose logs web --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
